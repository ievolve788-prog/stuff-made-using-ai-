<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lens AI Toolkit — Settings</title>
  <style>
    :root { color-scheme: light dark; --bg:#f8f9fa; --card:#fff; --fg:#202124; --muted:#5f6368; --line:#dadce0; --blue:#1a73e8; --green:#188038; --red:#d93025; }
    @media (prefers-color-scheme: dark) { :root { --bg:#17181a; --card:#202124; --fg:#e8eaed; --muted:#9aa0a6; --line:#3c4043; --blue:#8ab4f8; --green:#81c995; --red:#f28b82; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, sans-serif; }
    .wrap { max-width: 780px; margin: 0 auto; padding: 20px 16px 80px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 18px; }
    nav { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; position: sticky; top: 0; background: var(--bg); padding: 8px 0; z-index: 3; }
    nav a { color: var(--blue); text-decoration: none; border: 1px solid var(--line); border-radius: 14px; padding: 2px 10px; font-size: 13px; background: var(--card); }
    section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; }
    section > h2 { font-size: 16px; margin: 0 0 2px; }
    section > p.d { color: var(--muted); margin: 0 0 10px; font-size: 13px; }
    .opt { display: flex; align-items: flex-start; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); }
    .opt:first-of-type { border-top: 0; }
    .opt .txt { flex: 1; min-width: 0; }
    .opt .lb { font-weight: 500; }
    .opt .ht { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
    .opt .ctl { flex: none; max-width: 55%; }
    .opt.col { flex-direction: column; gap: 6px; }
    .opt.col .ctl { max-width: none; width: 100%; }
    .exp { display: inline-block; font-size: 11px; color: #b06000; border: 1px solid #f9ab00; border-radius: 8px; padding: 0 6px; margin-left: 6px; vertical-align: 1px; }
    /* switch */
    .sw { position: relative; display: block; width: 38px; height: 22px; flex: none; }
    .sw input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; cursor: pointer; z-index: 1; }
    .sw i { position: absolute; inset: 0; background: #9aa0a6; border-radius: 11px; transition: background .15s; }
    .sw i::after { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
    .sw input:checked + i { background: var(--blue); }
    .sw input:checked + i::after { transform: translateX(16px); }
    .sw input:focus-visible + i { outline: 2px solid var(--blue); outline-offset: 2px; }
    select, input[type=text], input[type=search], textarea { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; max-width: 100%; }
    textarea { width: 100%; min-height: 74px; resize: vertical; }
    button { font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 4px 11px; cursor: pointer; }
    button:hover { border-color: var(--blue); }
    button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    button.danger:hover { border-color: var(--red); color: var(--red); }
    .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
    .preset, .item { border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 10px; background: var(--bg); }
    .preset .top { display: flex; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
    .preset .top input[type=text] { flex: 1; min-width: 140px; }
    .item .t { white-space: pre-wrap; word-break: break-word; max-height: 7.5em; overflow: auto; }
    .item .m { color: var(--muted); font-size: 12px; margin: 5px 0; }
    .tag { display: inline-block; padding: 0 6px; border: 1px solid var(--line); border-radius: 8px; margin-right: 4px; }
    .empty { color: var(--muted); padding: 10px 0; }
    #saved { position: fixed; right: 16px; bottom: 16px; background: var(--green); color: #fff; padding: 6px 14px; border-radius: 16px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 9; }
    #saved.show { opacity: 1; }
    code, kbd { font: 12.5px ui-monospace, Consolas, monospace; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Lens AI Toolkit</h1>
    <p class="sub">Every feature has its own switch. Changes save at once. Use the popup's “Copy debug log” if anything misbehaves.</p>
    <nav id="nav"></nav>
    <div id="root"></div>
  </div>
  <div id="saved">Saved ✓</div>

  <script src="settings.js"></script>
  <script src="log.js"></script>
  <script src="textutil.js"></script>
  <script src="options.js"></script>
</body>
</html>
