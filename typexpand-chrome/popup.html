<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; width: 270px; padding: 12px; font: 13px/1.45 system-ui, sans-serif; }
    h1 { margin: 0 0 8px; font-size: 15px; }
    label { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    ul { margin: 0 0 10px; padding: 0; list-style: none; color: GrayText; font-size: 12px; }
    li { margin-bottom: 3px; }
    kbd { font: 11px ui-monospace, monospace; background: rgba(127,127,127,.2); padding: 1px 5px; border-radius: 4px; }
    button { width: 100%; padding: 6px; font: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Typexpand</h1>
  <label><input type="checkbox" id="enabled"> Expansion enabled</label>
  <ul id="keys"></ul>
  <button id="open">Edit snippets &amp; settings</button>
  <button id="copylog" style="margin-top:6px">Copy debug log</button>
  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
