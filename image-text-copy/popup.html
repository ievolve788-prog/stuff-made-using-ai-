<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Text Copier</title>
  <style>
    :root { --bg: #ffffff; --fg: #202124; --muted: #5f6368; --line: #dadce0; --accent: #1a73e8; --field: #f8f9fa; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #202124; --fg: #e8eaed; --muted: #9aa0a6; --line: #3c4043; --accent: #8ab4f8; --field: #292a2d; }
    }
    * { box-sizing: border-box; }
    body { width: 340px; margin: 0; padding: 14px; background: var(--bg); color: var(--fg); font: 13px/1.45 system-ui, sans-serif; }
    h1 { margin: 0 0 6px; font-size: 15px; }
    ol { margin: 6px 0 10px; padding-left: 20px; }
    li { margin: 3px 0; }
    p { margin: 6px 0; color: var(--muted); }
    .row { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    button { padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--fg); font: inherit; cursor: pointer; }
    button:hover { border-color: var(--accent); color: var(--accent); }
    hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0 8px; }
    #log { display: none; width: 100%; height: 160px; margin-top: 6px; padding: 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--field); color: var(--fg); font: 11px/1.4 ui-monospace, Consolas, monospace; white-space: pre; resize: vertical; }
    #msg { min-height: 1.3em; color: var(--accent); }
  </style>
</head>
<body>
  <h1>Image Text Copier</h1>
  <ol>
    <li>Hover an image and click the blue button (or right-click → “Copy text from this image”).</li>
    <li>Google AI Mode reads the text out of it.</li>
    <li>The exact text lands on your clipboard.</li>
  </ol>
  <div class="row">
    <button id="settings" type="button">Settings</button>
    <button id="panel" type="button">Open side panel</button>
  </div>
  <div id="msg"></div>

  <hr>
  <p>Something not working? Share the debug log:</p>
  <div class="row">
    <button id="copyLog" type="button">Copy debug log</button>
    <button id="showLog" type="button">Show</button>
    <button id="clearLog" type="button">Clear</button>
  </div>
  <textarea id="log" readonly spellcheck="false"></textarea>
  <script src="popup.js"></script>
</body>
</html>
